name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t heroku-bottle .
      - name: Smoke test the image
        run: |
          docker run -d --name web -p 8080:8080 heroku-bottle
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8080/ && break
            sleep 1
          done
          test "$(curl -fsS http://localhost:8080/)" = "Hello World!"
          curl -fsS http://localhost:8080/tpl | grep -q 'aaaabbbb'
          curl -fsSI http://localhost:8080/static/python-logo.png | grep -qi 'content-type: image/png'
          docker logs web
